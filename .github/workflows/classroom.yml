name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: ReverseLinkedList.java
      id: reverselinkedlist-java
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: ReverseLinkedList.java
        setup-command: javac ReverseLinkedList.java
        command: java ReverseLinkedList
        input: ''
        expected-output: |-
          Reversed LinkedList:
          J I H G F E D C B A
        comparison-method: contains
        timeout: 10
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        REVERSELINKEDLIST-JAVA_RESULTS: "${{steps.reverselinkedlist-java.outputs.result}}"
      with:
        runners: reverselinkedlist-java
